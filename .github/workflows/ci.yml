name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  juice-shop:
    name: end-to-end against OWASP Juice Shop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Start Juice Shop
        working-directory: examples/juice-shop
        run: docker compose up -d

      - name: Wait for it to seed
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3000/; then
              echo "ready after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "Juice Shop did not become ready" >&2
          exit 1

      - name: Prepare identities and fixtures
        working-directory: examples/juice-shop
        run: ./setup.sh

      - name: Scan
        working-directory: examples/juice-shop
        # Exit 1 is the expected result: Juice Shop is deliberately vulnerable and the plan
        # confirms a real BOLA. Any other code means the scan itself misbehaved.
        run: |
          set +e
          node ../../packages/trinker/dist/cli.js run --ci --format json > report.json
          code=$?
          set -e
          echo "trinker exited ${code}"
          if [ "${code}" -ne 1 ]; then
            echo "Expected exit 1 (finding confirmed), got ${code}" >&2
            cat report.json
            exit 1
          fi

      - name: Assert the expected outcome
        working-directory: examples/juice-shop
        # All three oracles must each confirm their own real flaw, and both negative controls pass.
        # The container is freshly seeded every run, which is what makes the state-mutation check
        # deterministic: re-running it against already-mutated state is inconclusive by design.
        run: |
          node -e '
            const report = require("./report.json");
            const { checks, findings } = report.result;
            const fail = (message) => { console.error(message); process.exit(1); };

            // Each of the three oracles must confirm its own real flaw.
            const oracles = findings.map((f) => f.oracle).sort();
            const expected = ["Differential Authorization", "Metamorphic Response", "State Mutation"];
            if (JSON.stringify(oracles) !== JSON.stringify(expected)) {
              fail(`expected one finding per oracle ${JSON.stringify(expected)}, got ${JSON.stringify(oracles)}`);
            }
            for (const finding of findings) {
              if (finding.replay.command !== `trinker verify ${finding.id}`) fail(`replay command does not match ${finding.id}`);
            }
            // Two negative controls must pass: an anonymous request refused, and an endpoint that
            // correctly ignores a caller-supplied scoping parameter. A run where everything fires
            // is as broken as one where nothing does; only the combination shows the oracles
            // actually discriminate.
            if (checks.passed !== 2) fail(`negative controls did not both pass: ${JSON.stringify(checks)}`);
            if (checks.inconclusive || checks.errored || checks.unavailable) fail(`scan was incomplete: ${JSON.stringify(checks)}`);
            if (JSON.stringify(report).includes("eyJ0eXAiOiJKV1Q")) fail("a JWT leaked into the report");

            for (const finding of findings) console.log("confirmed:", finding.id, "-", finding.oracle, "-", finding.title);
            console.log("both negative controls passed; no credentials in report");
          '

      - name: Replay the read-only findings
        working-directory: examples/juice-shop
        # TRK-0002 is the state-mutation finding and is deliberately not replayed: that check writes
        # and does not restore, so re-running it against already-changed state is untestable by
        # design and exits 3. The two read-only findings must reproduce exactly.
        run: |
          for id in TRK-0001 TRK-0003; do
            set +e
            node ../../packages/trinker/dist/cli.js verify "$id" > "verify-$id.md"
            code=$?
            set -e
            if [ "${code}" -ne 1 ]; then
              echo "Expected ${id} to reproduce (exit 1), got ${code}" >&2
              tail -5 "verify-$id.md"
              exit 1
            fi
            echo "${id} reproduced"
          done

      - name: Stop Juice Shop
        if: always()
        working-directory: examples/juice-shop
        run: docker compose down
